<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Overlay pets</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #090c10;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      image-rendering: pixelated;
    }
    .stage-note {
      position: fixed;
      z-index: 2;
      left: 12px;
      right: 12px;
      bottom: 10px;
      color: #8b949e;
      font-size: 13px;
      text-align: center;
      pointer-events: none;
    }
    a.back, button.cover {
      position: fixed;
      z-index: 2;
      top: 10px;
      color: #58a6ff;
      font-size: 13px;
      background: transparent;
      border: none;
      padding: 0;
    }
    a.back { right: 12px; }
    button.cover { left: 12px; }
  </style>
</head>
<body>
  <canvas id="overlay"></canvas>
  <div id="stage-note" class="stage-note"></div>
  <button id="fill-screen" class="cover" type="button">Cover the screen</button>
  <a class="back" href="/">Back to the room</a>
  <script type="module" src="/js/overlay.js"></script>
</body>
</html>
