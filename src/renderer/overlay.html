<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Overlay pets</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #090c10;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    .stage-note {
      position: absolute;
      left: 12px;
      bottom: 10px;
      color: #8b949e;
      font-size: 13px;
      pointer-events: none;
    }
    a.back {
      position: absolute;
      top: 10px;
      right: 12px;
      color: #58a6ff;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <canvas id="overlay"></canvas>
  <div id="stage-note" class="stage-note"></div>
  <a class="back" href="/">Back to the room</a>
  <script src="/shared/spatial.js"></script>
  <script src="/shared/movement.js"></script>
  <script src="/shared/session.js"></script>
  <script src="/shared/sprites.js"></script>
  <script src="/js/stage.js"></script>
  <script src="/js/overlay.js"></script>
</body>
</html>
