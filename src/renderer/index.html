<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    h1 {
      font-size: 24px;
      color: #58a6ff;
      margin-bottom: 20px;
      text-align: center;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .card h2 {
      font-size: 14px;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #0d1117;
      color: #c9d1d9;
      font-size: 14px;
      margin-bottom: 8px;
    }
    input:focus { outline: none; border-color: #58a6ff; }
    .btn-row { display: flex; gap: 8px; }
    button {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #21262d;
      color: #c9d1d9;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #30363d; }
    button.primary { background: #238636; border-color: #2ea043; color: #fff; }
    button.primary:hover { background: #2ea043; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #8b949e;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #484f58;
    }
    .dot.connected { background: #3fb950; box-shadow: 0 0 6px #3fb950; }
    .dot.disconnected { background: #f85149; }
    .room-info {
      font-size: 13px;
      color: #58a6ff;
      padding: 8px 0;
      min-height: 20px;
    }
    .friend-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .friend {
      padding: 6px 12px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 16px;
      font-size: 13px;
      color: #c9d1d9;
    }
    .pet-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .pet-item {
      width: 100%;
      aspect-ratio: 1;
      border: 2px solid #30363d;
      border-radius: 8px;
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.15s, transform 0.1s;
      background: #0d1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .pet-item:hover { border-color: #58a6ff; transform: scale(1.05); }
    .pet-item canvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    .pet-name {
      text-align: center;
      font-size: 11px;
      color: #8b949e;
      margin-top: 4px;
    }
    .chat-box {
      display: flex;
      gap: 8px;
    }
    .chat-box input { margin-bottom: 0; flex: 1; }
    .chat-box button { width: auto; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Overlay</h1>

    <div class="card">
      <h2>Connection</h2>
      <input id="room" placeholder="Room ID (leave blank for random)" />
      <input id="name" placeholder="Your name" value="player1" />
      <div class="btn-row">
        <button id="join" class="primary">Join Room</button>
        <button id="create">Create & Join</button>
      </div>
      <div style="margin-top: 12px;">
        <span class="status">
          <span class="dot" id="status-dot"></span>
          <span id="status">Disconnected</span>
        </span>
      </div>
      <div id="room-info" class="room-info"></div>
    </div>

    <div class="card">
      <h2>Online</h2>
      <div id="friends" class="friend-list"></div>
    </div>

    <div class="card">
      <h2>Send a Pet</h2>
      <div id="pet-list" class="pet-grid"></div>
    </div>

    <div class="card">
      <h2>Chat</h2>
      <div class="chat-box">
        <input id="msg" placeholder="Type a message..." />
        <button id="send">Send</button>
      </div>
    </div>
  </div>

  <script>
    const ws = new WebSocket('ws://localhost:55555');
    const roomInput = document.getElementById('room');
    const nameInput = document.getElementById('name');
    const joinBtn = document.getElementById('join');
    const createBtn = document.getElementById('create');
    const roomInfo = document.getElementById('room-info');
    const friendsDiv = document.getElementById('friends');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status');
    const msgInput = document.getElementById('msg');
    const sendBtn = document.getElementById('send');
    const petList = document.getElementById('pet-list');

    const uid = 'user-' + Math.random().toString(36).substr(2, 6);

    const pets = [
      { name: 'Cat', color: '#ff6b6b', shape: 'cat' },
      { name: 'Dog', color: '#4ecdc4', shape: 'dog' },
      { name: 'Ghost', color: '#ffe66d', shape: 'ghost' },
      { name: 'Fire', color: '#ff8a5c', shape: 'fire' },
      { name: 'Star', color: '#a29bfe', shape: 'star' },
      { name: 'Heart', color: '#fd79a8', shape: 'heart' }
    ];

    const frameSizes = { cat: 16, dog: 16, ghost: 16, fire: 16, star: 16, heart: 16 };
    const frames = { cat: 4, dog: 4, ghost: 4, fire: 4, star: 2, heart: 2 };
    const animTimers = {};

    pets.forEach((pet, i) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'pet-item';

      const canvas = document.createElement('canvas');
      canvas.width = frameSizes[pet.shape] * 4;
      canvas.height = frameSizes[pet.shape] * 4;
      canvas.style.imageRendering = 'pixelated';

      const name = document.createElement('div');
      name.className = 'pet-name';
      name.textContent = pet.name;

      wrapper.appendChild(canvas);
      wrapper.appendChild(name);
      petList.appendChild(wrapper);

      wrapper.onclick = () => {
        ws.send(JSON.stringify({
          type: 'pet',
          name: pet.name,
          shape: pet.shape,
          color: pet.color,
          x: 100 + i * 80,
          y: 100,
          width: 64,
          height: 64
        }));
      };

      animTimers[pet.name] = { frame: 0, timer: 0 };
    });

    function drawStarFrame(ctx, frame) {
      const s = 4;
      ctx.fillStyle = '#a29bfe';
      if (frame === 0) {
        ctx.fillRect(5*s, 1*s, 6*s, 2*s);
        ctx.fillRect(3*s, 3*s, 10*s, 2*s);
        ctx.fillRect(1*s, 5*s, 14*s, 2*s);
        ctx.fillRect(3*s, 7*s, 10*s, 2*s);
        ctx.fillRect(5*s, 9*s, 6*s, 2*s);
        ctx.fillRect(6*s, 11*s, 4*s, 2*s);
      } else {
        ctx.fillRect(5*s, 1*s, 6*s, 2*s);
        ctx.fillRect(3*s, 3*s, 10*s, 2*s);
        ctx.fillRect(1*s, 5*s, 14*s, 2*s);
        ctx.fillRect(3*s, 7*s, 10*s, 2*s);
        ctx.fillRect(5*s, 9*s, 6*s, 2*s);
        ctx.fillRect(6*s, 11*s, 4*s, 2*s);
        ctx.fillStyle = '#dfe6e9';
        ctx.fillRect(7*s, 4*s, 2*s, 2*s);
      }
    }

    function drawHeartFrame(ctx, frame) {
      const s = 4;
      ctx.fillStyle = '#fd79a8';
      if (frame === 0) {
        ctx.fillRect(2*s, 2*s, 5*s, 5*s);
        ctx.fillRect(9*s, 2*s, 5*s, 5*s);
        ctx.fillRect(1*s, 7*s, 7*s, 5*s);
        ctx.fillRect(8*s, 7*s, 7*s, 5*s);
        ctx.fillRect(4*s, 12*s, 4*s, 2*s);
        ctx.fillRect(5*s, 14*s, 2*s, 2*s);
      } else {
        ctx.fillRect(2*s, 2*s, 5*s, 5*s);
        ctx.fillRect(9*s, 2*s, 5*s, 5*s);
        ctx.fillRect(1*s, 7*s, 7*s, 5*s);
        ctx.fillRect(8*s, 7*s, 7*s, 5*s);
        ctx.fillRect(4*s, 12*s, 4*s, 2*s);
        ctx.fillRect(5*s, 14*s, 2*s, 2*s);
        ctx.fillStyle = '#fff';
        ctx.fillRect(3*s, 3*s, 2*s, 2*s);
        ctx.fillRect(10*s, 3*s, 2*s, 2*s);
      }
    }

    function drawFrame(ctx, shape, frame, color) {
      const s = 4;
      ctx.fillStyle = color;
      if (shape === 'cat') {
        ctx.fillRect(4*s, 3*s, 2*s, 2*s);
        ctx.fillRect(8*s, 3*s, 2*s, 2*s);
        ctx.fillRect(3*s, 5*s + frame, 8*s, 6*s);
        ctx.fillRect(2*s, 6*s + frame, 1*s, 2*s);
        ctx.fillRect(11*s, 6*s + frame, 1*s, 2*s);
        ctx.fillRect(4*s, 11*s, 2*s, 2*s);
        ctx.fillRect(9*s, 11*s, 2*s, 2*s);
        ctx.fillStyle = '#111';
        ctx.fillRect(5*s, 7*s, 1*s, 1*s);
        ctx.fillRect(9*s, 7*s, 1*s, 1*s);
      } else if (shape === 'dog') {
        ctx.fillRect(3*s, 3*s, 2*s, 2*s);
        ctx.fillRect(9*s, 3*s, 2*s, 2*s);
        ctx.fillRect(2*s, 5*s, 10*s, 7*s);
        ctx.fillRect(1*s, 7*s + frame, 2*s, 3*s);
        ctx.fillRect(12*s, 7*s + frame, 2*s, 3*s);
        ctx.fillRect(4*s, 12*s, 3*s, 2*s);
        ctx.fillRect(8*s, 12*s, 3*s, 2*s);
        ctx.fillStyle = '#111';
        ctx.fillRect(5*s, 8*s, 1*s, 1*s);
        ctx.fillRect(9*s, 8*s, 1*s, 1*s);
      } else if (shape === 'ghost') {
        const wave = (frame % 2 === 0) ? 0 : s;
        ctx.fillRect(3*s, 1*s, 9*s, 11*s);
        ctx.fillRect(2*s, 3*s + wave, 1*s, 8*s);
        ctx.fillRect(13*s, 3*s - wave, 1*s, 8*s);
        ctx.fillRect(2*s, 11*s, 2*s, 2*s);
        ctx.fillRect(6*s, 11*s, 2*s, 2*s);
        ctx.fillRect(10*s, 11*s, 2*s, 2*s);
        ctx.fillRect(14*s, 11*s, 2*s, 2*s);
        ctx.fillStyle = '#111';
        ctx.fillRect(5*s, 5*s, 2*s, 2*s);
        ctx.fillRect(9*s, 5*s, 2*s, 2*s);
      } else if (shape === 'fire') {
        const flicker = (frame % 2 === 0) ? 0 : s;
        ctx.fillRect(5*s, 12*s, 5*s, 2*s);
        ctx.fillRect(4*s, 10*s, 7*s, 2*s);
        ctx.fillRect(5*s, 8*s, 5*s, 2*s);
        ctx.fillRect(3*s, 6*s, 9*s, 2*s);
        ctx.fillRect(5*s, 4*s + flicker, 5*s, 2*s);
        ctx.fillRect(6*s, 2*s + flicker, 3*s, 2*s);
        ctx.fillStyle = '#fff';
        ctx.fillRect(7*s, 3*s, 1*s, 1*s);
        ctx.fillRect(8*s, 5*s, 1*s, 1*s);
      } else if (shape === 'star') {
        drawStarFrame(ctx, frame);
      } else if (shape === 'heart') {
        drawHeartFrame(ctx, frame);
      }
    }

    function animatePets() {
      pets.forEach((pet) => {
        const item = petList.children[pets.indexOf(pet)];
        if (!item) return;
        const canvas = item.querySelector('canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const s = frameSizes[pet.shape];
        const maxFrames = frames[pet.shape] || 1;
        const timer = animTimers[pet.name];
        timer.timer++;
        if (timer.timer > 20) {
          timer.frame = (timer.frame + 1) % maxFrames;
          timer.timer = 0;
        }
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawFrame(ctx, pet.shape, timer.frame, pet.color);
      });
      requestAnimationFrame(animatePets);
    }
    animatePets();

    ws.onopen = () => {
      statusDot.className = 'dot connected';
      statusText.textContent = 'Connected';
    };
    ws.onclose = () => {
      statusDot.className = 'dot disconnected';
      statusText.textContent = 'Disconnected';
    };

    joinBtn.onclick = () => {
      ws.send(JSON.stringify({ type: 'join', roomId: roomInput.value, name: nameInput.value, id: uid }));
    };

    createBtn.onclick = () => {
      const roomId = 'room-' + Math.random().toString(36).substr(2, 6);
      roomInput.value = roomId;
      ws.send(JSON.stringify({ type: 'join', roomId: roomId, name: nameInput.value, id: uid }));
    };

    sendBtn.onclick = () => {
      ws.send(JSON.stringify({ type: 'send', text: msgInput.value, roomId: roomInput.value }));
      msgInput.value = '';
    };

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'presence') {
        friendsDiv.innerHTML = msg.users.map(u =>
          `<div class="friend">${u.name || u.id || 'unknown'}</div>`
        ).join('');
      }
      if (msg.type === 'send') {
        friendsDiv.innerHTML += `<div class="friend">[${msg.roomId}] ${msg.text}</div>`;
      }
      if (msg.type === 'room_created') {
        roomInfo.textContent = 'Room "' + msg.roomId + '" created!';
      }
      if (msg.type === 'user_joined') {
        roomInfo.textContent = (roomInfo.textContent || '') + ' ' + msg.user.name + ' joined';
      }
      if (msg.type === 'user_left') {
        roomInfo.textContent = (roomInfo.textContent || '') + ' ' + msg.user.name + ' left';
      }
    };
  </script>
</body>
</html>
