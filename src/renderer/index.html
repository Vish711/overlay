<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 20px;
      background: #1a1a1a;
      color: #fff;
    }
    h1 { margin-top: 0; }
    input, button {
      padding: 8px 12px;
      margin: 4px 0;
      border: 1px solid #444;
      border-radius: 4px;
      background: #2a2a2a;
      color: #fff;
    }
    button:hover { background: #3a3a3a; }
    #friends { margin-top: 16px; }
    .friend {
      padding: 8px;
      margin: 4px 0;
      background: #2a2a2a;
      border-radius: 4px;
    }
    #status { margin-top: 8px; color: #888; }
    #send-msg { margin-top: 12px; }
    #send-msg input { width: 200px; }
    #send-msg button { margin-left: 4px; }
  </style>
</head>
<body>
  <h1>Overlay</h1>
  <input id="room" placeholder="Room ID" />
  <button id="join">Join Room</button>
  <div id="status">Disconnected</div>
  <div id="friends"></div>
  <div id="pets">
    <h3>Send a pet</h3>
    <div id="pet-list"></div>
  </div>
  <div id="send-msg">
    <input id="msg" placeholder="Type a message..." />
    <button id="send">Send</button>
  </div>
  <script>
    const ws = new WebSocket('ws://localhost:55555');
    const roomInput = document.getElementById('room');
    const joinBtn = document.getElementById('join');
    const friendsDiv = document.getElementById('friends');
    const statusDiv = document.getElementById('status');
    const msgInput = document.getElementById('msg');
    const sendBtn = document.getElementById('send');
    const petList = document.getElementById('pet-list');

    const availablePets = [
      { name: 'cat', src: 'https://media.giphy.com/media/MDJ7IWxgDYtb2/giphy.gif', width: 64, height: 64 },
      { name: 'dog', src: 'https://media.giphy.com/media/3oriO04MiRIucIKngJ/giphy.gif', width: 64, height: 64 },
      { name: 'ghost', src: 'https://media.giphy.com/media/l0HlBO7eyXzSZkJri/giphy.gif', width: 64, height: 64 },
      { name: 'fire', src: 'https://media.giphy.com/media/26tOZ42Mg6pbTevuM/giphy.gif', width: 64, height: 64 }
    ];

    availablePets.forEach((pet, i) => {
      const img = document.createElement('img');
      img.src = pet.src;
      img.width = 64;
      img.height = 64;
      img.style.margin = '4px';
      img.style.cursor = 'pointer';
      img.style.border = '2px solid transparent';
      img.title = pet.name;
      img.onclick = () => {
        ws.send(JSON.stringify({
          type: 'pet',
          name: pet.name,
          src: pet.src,
          x: 100 + i * 80,
          y: 100,
          width: pet.width,
          height: pet.height
        }));
      };
      petList.appendChild(img);
    });

    ws.onopen = () => { statusDiv.textContent = 'Connected'; };
    ws.onclose = () => { statusDiv.textContent = 'Disconnected'; };

    joinBtn.onclick = () => {
      ws.send(JSON.stringify({ type: 'join', roomId: roomInput.value }));
    };

    sendBtn.onclick = () => {
      ws.send(JSON.stringify({ type: 'send', text: msgInput.value, roomId: roomInput.value }));
      msgInput.value = '';
    };

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'presence') {
        friendsDiv.innerHTML = msg.users.map(u =>
          `<div class="friend">${u.id || 'unknown'}</div>`
        ).join('');
      }
      if (msg.type === 'send') {
        friendsDiv.innerHTML += `<div class="friend">[${msg.roomId}] ${msg.text}</div>`;
      }
    };
  </script>
</body>
</html>
