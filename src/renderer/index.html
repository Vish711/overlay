<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    h1 {
      font-size: 24px;
      color: #58a6ff;
      margin-bottom: 20px;
      text-align: center;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .card h2 {
      font-size: 14px;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #0d1117;
      color: #c9d1d9;
      font-size: 14px;
      margin-bottom: 8px;
    }
    input:focus { outline: none; border-color: #58a6ff; }
    .btn-row { display: flex; gap: 8px; }
    button {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #21262d;
      color: #c9d1d9;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #30363d; }
    button.primary { background: #238636; border-color: #2ea043; color: #fff; }
    button.primary:hover { background: #2ea043; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #8b949e;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #484f58;
    }
    .dot.connected { background: #3fb950; box-shadow: 0 0 6px #3fb950; }
    .dot.disconnected { background: #f85149; }
    .room-info {
      font-size: 13px;
      color: #58a6ff;
      padding: 8px 0;
      min-height: 20px;
    }
    .friend-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .friend {
      padding: 6px 12px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 16px;
      font-size: 13px;
      color: #c9d1d9;
    }
    .pet-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .pet-item {
      width: 100%;
      aspect-ratio: 1;
      border: 2px solid #30363d;
      border-radius: 8px;
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.15s, transform 0.1s;
      background: #0d1117;
    }
    .pet-item:hover { border-color: #58a6ff; transform: scale(1.05); }
    .pet-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .pet-name {
      text-align: center;
      font-size: 11px;
      color: #8b949e;
      margin-top: 4px;
    }
    .chat-box {
      display: flex;
      gap: 8px;
    }
    .chat-box input { margin-bottom: 0; flex: 1; }
    .chat-box button { width: auto; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Overlay</h1>

    <div class="card">
      <h2>Connection</h2>
      <input id="room" placeholder="Room ID (leave blank for random)" />
      <input id="name" placeholder="Your name" value="player1" />
      <div class="btn-row">
        <button id="join" class="primary">Join Room</button>
        <button id="create">Create & Join</button>
      </div>
      <div style="margin-top: 12px;">
        <span class="status">
          <span class="dot" id="status-dot"></span>
          <span id="status">Disconnected</span>
        </span>
      </div>
      <div id="room-info" class="room-info"></div>
    </div>

    <div class="card">
      <h2>Online</h2>
      <div id="friends" class="friend-list"></div>
    </div>

    <div class="card">
      <h2>Send a Pet</h2>
      <div id="pet-list" class="pet-grid"></div>
    </div>

    <div class="card">
      <h2>Chat</h2>
      <div class="chat-box">
        <input id="msg" placeholder="Type a message..." />
        <button id="send">Send</button>
      </div>
    </div>
  </div>

  <script>
    const ws = new WebSocket('ws://localhost:55555');
    const roomInput = document.getElementById('room');
    const nameInput = document.getElementById('name');
    const joinBtn = document.getElementById('join');
    const createBtn = document.getElementById('create');
    const roomInfo = document.getElementById('room-info');
    const friendsDiv = document.getElementById('friends');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status');
    const msgInput = document.getElementById('msg');
    const sendBtn = document.getElementById('send');
    const petList = document.getElementById('pet-list');

    const uid = 'user-' + Math.random().toString(36).substr(2, 6);

    const petFiles = ['cat.gif', 'dog.gif', 'ghost.gif', 'fire.gif', 'star.gif', 'heart.gif'];
    const petNames = { 'cat.gif': 'Cat', 'dog.gif': 'Dog', 'ghost.gif': 'Ghost', 'fire.gif': 'Fire', 'star.gif': 'Star', 'heart.gif': 'Heart' };

    petFiles.forEach((filename, i) => {
      const wrapper = document.createElement('div');
      wrapper.style.textAlign = 'center';

      const img = document.createElement('img');
      img.src = '/pets/' + filename;
      img.alt = petNames[filename];
      img.title = petNames[filename];

      const name = document.createElement('div');
      name.className = 'pet-name';
      name.textContent = petNames[filename];

      wrapper.appendChild(img);
      wrapper.appendChild(name);
      petList.appendChild(wrapper);

      img.onclick = () => {
        ws.send(JSON.stringify({
          type: 'pet',
          name: petNames[filename],
          src: '/pets/' + filename,
          x: 100 + i * 80,
          y: 100,
          width: 64,
          height: 64
        }));
      };
    });

    ws.onopen = () => {
      statusDot.className = 'dot connected';
      statusText.textContent = 'Connected';
    };
    ws.onclose = () => {
      statusDot.className = 'dot disconnected';
      statusText.textContent = 'Disconnected';
    };

    joinBtn.onclick = () => {
      ws.send(JSON.stringify({ type: 'join', roomId: roomInput.value, name: nameInput.value, id: uid }));
    };

    createBtn.onclick = () => {
      const roomId = 'room-' + Math.random().toString(36).substr(2, 6);
      roomInput.value = roomId;
      ws.send(JSON.stringify({ type: 'join', roomId: roomId, name: nameInput.value, id: uid }));
    };

    sendBtn.onclick = () => {
      ws.send(JSON.stringify({ type: 'send', text: msgInput.value, roomId: roomInput.value }));
      msgInput.value = '';
    };

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'presence') {
        friendsDiv.innerHTML = msg.users.map(u =>
          `<div class="friend">${u.name || u.id || 'unknown'}</div>`
        ).join('');
      }
      if (msg.type === 'send') {
        friendsDiv.innerHTML += `<div class="friend">[${msg.roomId}] ${msg.text}</div>`;
      }
      if (msg.type === 'room_created') {
        roomInfo.textContent = 'Room "' + msg.roomId + '" created!';
      }
      if (msg.type === 'user_joined') {
        roomInfo.textContent = (roomInfo.textContent || '') + ' ' + msg.user.name + ' joined';
      }
      if (msg.type === 'user_left') {
        roomInfo.textContent = (roomInfo.textContent || '') + ' ' + msg.user.name + ' left';
      }
    };
  </script>
</body>
</html>
